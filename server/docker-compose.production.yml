# docker-compose.production.yml
# Production-specific overrides for Notely Platform V3
#
# Usage: docker compose -f docker-compose.yml -f docker-compose.production.yml up -d
#
# This file contains production-specific settings that differ from development:
# - PostgreSQL SSL encryption
# - Production-mode service commands (npm start vs npm run dev)
# - No volume mounts for hot reloading (immutable containers)
# - Restart policies for critical services

services:
  # PostgreSQL with SSL encryption
  postgres:
    command: >
      -c ssl=on
      -c ssl_cert_file=/var/lib/postgresql/server.crt
      -c ssl_key_file=/var/lib/postgresql/server.key
    volumes:
      - ./services/postgres/ssl/server.crt:/var/lib/postgresql/server.crt:ro
      - ./services/postgres/ssl/server.key:/var/lib/postgresql/server.key:ro
      - postgres-v3-data:/var/lib/postgresql/data

  # Sync service in production mode
  sync:
    command: npm start
    volumes: []  # Override - remove dev volume mounts

  # Gateway - remove dev volume mounts for immutable container
  gateway:
    volumes: []

  # Auth - remove dev volume mounts for immutable container
  auth:
    volumes: []

  # Portal BFF - remove dev volume mounts for immutable container
  portal-bff:
    volumes: []

  # Admin Config - keep only the ip-whitelist.conf mount (needed at runtime)
  admin-config:
    volumes:
      - ./services/nginx/ip-whitelist.conf:/workspace/services/nginx/ip-whitelist.conf

  # Summaries service in production mode
  summaries:
    command: npm start
    volumes: []  # Override - remove dev volume mounts
