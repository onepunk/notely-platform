# Prometheus Configuration for Notely Platform
# Comprehensive system and application monitoring

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alerting configuration (optional - uncomment to enable Alertmanager)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - alertmanager:9093

# Rule files for alerts
rule_files:
  # - /etc/prometheus/rules/*.yml

scrape_configs:
  # =============================================================================
  # APPLICATION METRICS
  # =============================================================================

  # API Gateway metrics
  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets:
          - gateway:3200
    relabel_configs:
      - target_label: service
        replacement: gateway

  # Auth service metrics
  - job_name: auth
    metrics_path: /metrics
    static_configs:
      - targets:
          - auth:3201
    relabel_configs:
      - target_label: service
        replacement: auth

  # Sync service metrics
  - job_name: sync
    metrics_path: /metrics
    static_configs:
      - targets:
          - sync:3205
    relabel_configs:
      - target_label: service
        replacement: sync

  # =============================================================================
  # INFRASTRUCTURE METRICS
  # =============================================================================

  # Node Exporter - System metrics (CPU, RAM, Disk, Network, RAID)
  - job_name: node
    metrics_path: /metrics
    static_configs:
      - targets:
          - node-exporter:9100
    relabel_configs:
      - target_label: instance
        replacement: notely-server

  # DCGM Exporter - NVIDIA GPU metrics (utilization, memory, temperature, power)
  - job_name: dcgm
    metrics_path: /metrics
    static_configs:
      - targets:
          - dcgm-exporter:9400
    relabel_configs:
      - target_label: instance
        replacement: notely-server

  # cAdvisor - Container metrics
  - job_name: cadvisor
    metrics_path: /metrics
    static_configs:
      - targets:
          - cadvisor:8080
    relabel_configs:
      - target_label: instance
        replacement: notely-server

  # Nginx Exporter - Nginx metrics
  - job_name: nginx
    metrics_path: /metrics
    static_configs:
      - targets:
          - nginx-exporter:9113
    relabel_configs:
      - target_label: service
        replacement: nginx

  # =============================================================================
  # DATABASE & CACHE METRICS
  # =============================================================================

  # PostgreSQL Exporter
  - job_name: postgres
    metrics_path: /metrics
    static_configs:
      - targets:
          - postgres-exporter:9187
    relabel_configs:
      - target_label: service
        replacement: postgres

  # Redis Exporter
  - job_name: redis
    metrics_path: /metrics
    static_configs:
      - targets:
          - redis-exporter:9121
    relabel_configs:
      - target_label: service
        replacement: redis

  # =============================================================================
  # SELF-MONITORING
  # =============================================================================

  # Prometheus self-monitoring
  - job_name: prometheus
    metrics_path: /metrics
    static_configs:
      - targets:
          - localhost:9090

  # Loki metrics (if exposed)
  - job_name: loki
    metrics_path: /metrics
    static_configs:
      - targets:
          - loki:3100
