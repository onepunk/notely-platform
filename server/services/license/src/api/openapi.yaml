openapi: 3.0.3
info:
  title: Notely License Service API
  version: 1.0.0
  description: |
    The Notely License Service provides license generation, validation, and management capabilities
    for the Notely platform. It supports both online and offline validation scenarios using
    cryptographically signed JWT-based licenses.

    ## Features
    - RSA-4096 cryptographic signing
    - JWT-based license format
    - Offline validation support
    - Hardware binding capabilities
    - Multi-tenant organization support
    - Feature flags and resource limits
    - License lifecycle management

    ## Authentication
    Admin endpoints require JWT Bearer token authentication with admin role.
    Validation endpoints are public but rate-limited.

  contact:
    name: Notely Platform Team
    email: platform@example.com
  license:
    name: Proprietary

servers:
  - url: http://localhost:3210
    description: Local development
  - url: https://api-dev.yourdomain.com
    description: Development environment
  - url: https://api-staging.yourdomain.com
    description: Staging environment
  - url: https://api.yourdomain.com
    description: Production environment

tags:
  - name: Health
    description: Service health and readiness endpoints
  - name: Validation
    description: Public license validation and verification
  - name: Admin
    description: Administrative license management operations

security:
  - BearerAuth: []

paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check (liveness probe)
      description: Returns basic health status of the service
      operationId: healthCheck
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok

  /ready:
    get:
      tags:
        - Health
      summary: Readiness check
      description: |
        Checks if the service is ready to handle requests by verifying:
        - Database connectivity
        - Redis connectivity
        - License keys availability
      operationId: readinessCheck
      security: []
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
              example:
                status: ready
                checks:
                  database_connected: true
                  redis_connected: true
                  keys_loaded: true
        '503':
          description: Service is not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
              example:
                status: unhealthy
                checks:
                  database_connected: true
                  redis_connected: false
                  keys_loaded: true
                error: Redis connection failed

  /metrics:
    get:
      tags:
        - Health
      summary: Prometheus metrics
      description: Returns Prometheus-formatted metrics for monitoring
      operationId: getMetrics
      security: []
      responses:
        '200':
          description: Prometheus metrics
          content:
            text/plain:
              schema:
                type: string
              example: |
                # HELP http_requests_total Total number of HTTP requests
                # TYPE http_requests_total counter
                http_requests_total{method="GET",path="/health",status="200"} 42

  /api/license/validate:
    post:
      tags:
        - Validation
      summary: Validate a license key
      description: |
        Validates a license key and returns license details if valid.
        This endpoint verifies:
        - JWT signature authenticity
        - License expiration status
        - Hardware ID binding (if provided)
        - Revocation status (future)

        Rate limit: 100 requests per minute per IP
      operationId: validateLicense
      security: []
      x-rate-limit:
        requests: 100
        period: 60
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateLicenseRequest'
            examples:
              withHardwareId:
                summary: Validation with hardware ID
                value:
                  licenseKey: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9...
                  hardwareId: ABC123-DEF456-GHI789
              withoutHardwareId:
                summary: Validation without hardware ID
                value:
                  licenseKey: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        '200':
          description: Validation result (success or failure)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidLicenseResponse'
                  - $ref: '#/components/schemas/InvalidLicenseResponse'
              examples:
                valid:
                  summary: Valid license
                  value:
                    valid: true
                    licenseId: 123e4567-e89b-12d3-a456-426614174002
                    type: subscription
                    organizationId: 123e4567-e89b-12d3-a456-426614174000
                    userId: 123e4567-e89b-12d3-a456-426614174001
                    features:
                      meetings: true
                      recording: false
                      transcription: true
                    limits:
                      maxUsers: 100
                      maxStorage: 1000
                    issuedAt: '2025-11-13T14:30:00Z'
                    expiresAt: '2025-12-31T23:59:59Z'
                expired:
                  summary: Expired license
                  value:
                    valid: false
                    reason: License has expired
                invalid:
                  summary: Invalid license
                  value:
                    valid: false
                    reason: License key is invalid or has been tampered with
                hardwareMismatch:
                  summary: Hardware ID mismatch
                  value:
                    valid: false
                    reason: Hardware ID mismatch
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                error: Validation failed
                details:
                  - field: licenseKey
                    message: License key is required
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Rate limit exceeded
                message: Too many validation requests. Please try again later.
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/license/public-key:
    get:
      tags:
        - Validation
      summary: Get public key for offline validation
      description: |
        Returns the RSA-4096 public key in PEM format for offline license validation.
        Clients can cache this key and use it to validate licenses without network access.

        Rate limit: 10 requests per minute per IP
      operationId: getPublicKey
      security: []
      x-rate-limit:
        requests: 10
        period: 60
      responses:
        '200':
          description: Public key in PEM format
          content:
            text/plain:
              schema:
                type: string
              example: |
                -----BEGIN PUBLIC KEY-----
                MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEA3QKj7qHPZGN8mKZQh...
                -----END PUBLIC KEY-----
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/license/admin/generate:
    post:
      tags:
        - Admin
      summary: Generate a new license key
      description: |
        Generates a new cryptographically signed license key with specified parameters.

        **Authentication Required:** Admin role
        **Rate limit:** 50 requests per minute

        The license key is a JWT token signed with RSA-4096 containing:
        - License ID (unique identifier)
        - Organization and user associations
        - Feature flags and resource limits
        - Expiration date (for subscription/trial)
        - Hardware binding (optional)
      operationId: generateLicense
      security:
        - BearerAuth: []
      x-rate-limit:
        requests: 50
        period: 60
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateLicenseRequest'
            examples:
              perpetual:
                summary: Perpetual license
                value:
                  type: perpetual
                  organizationId: 123e4567-e89b-12d3-a456-426614174000
                  userId: 123e4567-e89b-12d3-a456-426614174001
                  features:
                    meetings: true
                    recording: true
                    transcription: true
                  limits:
                    maxUsers: 500
                    maxStorage: 10000
              subscription:
                summary: Subscription license
                value:
                  type: subscription
                  organizationId: 123e4567-e89b-12d3-a456-426614174000
                  userId: 123e4567-e89b-12d3-a456-426614174001
                  features:
                    meetings: true
                    recording: false
                  limits:
                    maxUsers: 100
                    maxStorage: 1000
                  expiresAt: '2026-01-31T23:59:59Z'
              trial:
                summary: Trial license with hardware binding
                value:
                  type: trial
                  organizationId: 123e4567-e89b-12d3-a456-426614174000
                  userId: 123e4567-e89b-12d3-a456-426614174001
                  hardwareId: ABC123-DEF456-GHI789
                  features:
                    meetings: true
                  limits:
                    maxUsers: 10
                  expiresAt: '2025-12-13T23:59:59Z'
      responses:
        '201':
          description: License generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseResponse'
              example:
                licenseKey: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9....
                licenseId: 123e4567-e89b-12d3-a456-426614174002
                type: subscription
                organizationId: 123e4567-e89b-12d3-a456-426614174000
                userId: 123e4567-e89b-12d3-a456-426614174001
                features:
                  meetings: true
                  recording: false
                limits:
                  maxUsers: 100
                  maxStorage: 1000
                issuedAt: '2025-11-13T14:30:00Z'
                expiresAt: '2026-01-31T23:59:59Z'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                missingExpiration:
                  summary: Missing expiration for subscription
                  value:
                    error: Validation failed
                    message: expiresAt is required for subscription and trial licenses
                invalidUUID:
                  summary: Invalid UUID format
                  value:
                    error: Validation failed
                    details:
                      - field: organizationId
                        message: Organization ID must be a valid UUID
        '401':
          description: Unauthorized - missing or invalid authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Unauthorized
                message: Authentication token is required
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Forbidden
                message: Admin role is required
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/license/admin/info/{licenseKey}:
    get:
      tags:
        - Admin
      summary: Get license information
      description: |
        Retrieves detailed information about a specific license by decoding and verifying the license key.

        **Authentication Required:** Admin role
        **Rate limit:** 50 requests per minute
      operationId: getLicenseInfo
      security:
        - BearerAuth: []
      x-rate-limit:
        requests: 50
        period: 60
      parameters:
        - name: licenseKey
          in: path
          required: true
          description: The license key to retrieve information for
          schema:
            type: string
          example: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        '200':
          description: License information retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseInfo'
              example:
                licenseId: 123e4567-e89b-12d3-a456-426614174002
                type: subscription
                organizationId: 123e4567-e89b-12d3-a456-426614174000
                userId: 123e4567-e89b-12d3-a456-426614174001
                features:
                  meetings: true
                  recording: false
                  transcription: true
                limits:
                  maxUsers: 100
                  maxStorage: 1000
                issuedAt: '2025-11-13T14:30:00Z'
                expiresAt: '2025-12-31T23:59:59Z'
                hardwareId: ABC123-DEF456-GHI789
                issuer: notely-license-service
        '400':
          description: Invalid or expired license key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                expired:
                  summary: License expired
                  value:
                    error: License expired
                    message: The license key has expired
                    expiredAt: '2025-10-31T23:59:59Z'
                invalid:
                  summary: Invalid license key
                  value:
                    error: Invalid license key
                    message: The provided license key is not valid or has been tampered with
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/license/admin/revoke/{licenseKey}:
    post:
      tags:
        - Admin
      summary: Revoke a license key
      description: |
        Permanently revokes a license key, preventing it from being validated successfully.

        **Authentication Required:** Admin role
        **Rate limit:** 50 requests per minute

        **Note:** Revocation is currently implemented by marking the license as revoked
        in the database. Future versions will support real-time revocation lists.
      operationId: revokeLicense
      security:
        - BearerAuth: []
      x-rate-limit:
        requests: 50
        period: 60
      parameters:
        - name: licenseKey
          in: path
          required: true
          description: The license key to revoke
          schema:
            type: string
          example: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        '200':
          description: License revoked successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeLicenseResponse'
              example:
                success: true
                message: License revoked successfully
                licenseKey: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9...
                revokedAt: '2025-11-13T15:30:00Z'
        '400':
          description: Invalid license key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Invalid license key
                message: The provided license key is not valid or has been tampered with
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT authentication token obtained from the Auth service.
        Admin endpoints require tokens with 'admin' role.

        Example: `Authorization: Bearer eyJhbGc...`

  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [ok]
          description: Health status indicator
      example:
        status: ok

    ReadinessResponse:
      type: object
      required:
        - status
        - checks
      properties:
        status:
          type: string
          enum: [ready, unhealthy]
          description: Overall readiness status
        checks:
          type: object
          required:
            - database_connected
            - redis_connected
            - keys_loaded
          properties:
            database_connected:
              type: boolean
              description: PostgreSQL connection status
            redis_connected:
              type: boolean
              description: Redis connection status
            keys_loaded:
              type: boolean
              description: License keys availability
        error:
          type: string
          description: Error message if status is unhealthy

    ValidateLicenseRequest:
      type: object
      required:
        - licenseKey
      properties:
        licenseKey:
          type: string
          description: The license key (JWT) to validate
          minLength: 1
          example: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9...
        hardwareId:
          type: string
          description: Hardware identifier for device binding verification
          example: ABC123-DEF456-GHI789

    ValidLicenseResponse:
      type: object
      required:
        - valid
        - licenseId
        - type
        - organizationId
        - userId
        - features
        - limits
        - issuedAt
      properties:
        valid:
          type: boolean
          enum: [true]
          description: Indicates the license is valid
        licenseId:
          type: string
          format: uuid
          description: Unique license identifier
        type:
          type: string
          enum: [perpetual, subscription, trial]
          description: License type
        organizationId:
          type: string
          format: uuid
          description: Associated organization ID
        userId:
          type: string
          format: uuid
          description: Associated user ID
        features:
          type: object
          additionalProperties:
            type: boolean
          description: Feature flags enabled for this license
          example:
            meetings: true
            recording: false
            transcription: true
        limits:
          type: object
          additionalProperties:
            type: integer
          description: Resource limits for this license
          example:
            maxUsers: 100
            maxStorage: 1000
        issuedAt:
          type: string
          format: date-time
          description: License issuance timestamp (ISO 8601)
        expiresAt:
          type: string
          format: date-time
          description: License expiration timestamp (ISO 8601, optional for perpetual)
        hardwareId:
          type: string
          description: Hardware identifier if license is hardware-bound

    InvalidLicenseResponse:
      type: object
      required:
        - valid
        - reason
      properties:
        valid:
          type: boolean
          enum: [false]
          description: Indicates the license is invalid
        reason:
          type: string
          description: Reason why the license is invalid
          enum:
            - License has expired
            - License key is invalid or has been tampered with
            - Hardware ID mismatch
            - License has been revoked
          example: License has expired

    GenerateLicenseRequest:
      type: object
      required:
        - type
        - userId
      properties:
        productType:
          type: string
          enum: [portal, desktop]
          description: Product family the license applies to
          default: portal
        type:
          type: string
          enum: [perpetual, subscription, trial]
          description: Billing/term type of the license
        organizationId:
          type: string
          nullable: true
          description: Optional organization identifier (required for portal licenses)
          example: enterprise-acme-west
        userId:
          type: string
          format: uuid
          description: User ID this license is for
        hardwareId:
          type: string
          description: Optional hardware identifier for device binding
        features:
          type: object
          additionalProperties:
            type: boolean
          description: Feature flags to enable
          default: {}
          example:
            meetings: true
            recording: false
        limits:
          type: object
          additionalProperties:
            type: integer
            minimum: 1
          description: Resource limits to enforce
          default: {}
          example:
            maxUsers: 100
            maxStorage: 1000
        expiresAt:
          type: string
          format: date-time
          description: Expiration timestamp (ISO 8601) - required for subscription/trial
          example: '2026-01-31T23:59:59Z'
        notes:
          type: string
          description: Optional internal notes for this license
          example: 'Issued for Q4 pilot program'

    LicenseResponse:
      type: object
      required:
        - licenseKey
        - licenseId
        - type
        - userId
        - features
        - limits
        - issuedAt
        - productType
      properties:
        licenseKey:
          type: string
          description: The generated license key (JWT)
        licenseId:
          type: string
          format: uuid
          description: Unique license identifier
        type:
          type: string
          enum: [perpetual, subscription, trial]
          description: License term
        productType:
          type: string
          enum: [portal, desktop]
          description: Product family for the license
        organizationId:
          type: string
          nullable: true
          description: Organization identifier when provided
        userId:
          type: string
          format: uuid
          description: User ID
        features:
          type: object
          additionalProperties:
            type: boolean
          description: Enabled features
        limits:
          type: object
          additionalProperties:
            type: integer
          description: Resource limits
        issuedAt:
          type: string
          format: date-time
          description: Issuance timestamp
        expiresAt:
          type: string
          format: date-time
          description: Expiration timestamp (if applicable)
        hardwareId:
          type: string
          description: Hardware ID (if bound)

    LicenseInfo:
      type: object
      required:
        - licenseId
        - type
        - organizationId
        - userId
        - features
        - limits
        - issuedAt
        - issuer
      properties:
        licenseId:
          type: string
          format: uuid
          description: License identifier
        type:
          type: string
          enum: [perpetual, subscription, trial]
          description: License type
        organizationId:
          type: string
          format: uuid
          description: Organization ID
        userId:
          type: string
          format: uuid
          description: User ID
        features:
          type: object
          additionalProperties:
            type: boolean
          description: Feature flags
        limits:
          type: object
          additionalProperties:
            type: integer
          description: Resource limits
        issuedAt:
          type: string
          format: date-time
          description: Issuance timestamp
        expiresAt:
          type: string
          format: date-time
          description: Expiration timestamp
        hardwareId:
          type: string
          description: Hardware identifier
        issuer:
          type: string
          description: Issuer identifier
          example: notely-license-service

    RevokeLicenseResponse:
      type: object
      required:
        - success
        - message
        - licenseKey
        - revokedAt
      properties:
        success:
          type: boolean
          enum: [true]
          description: Revocation success indicator
        message:
          type: string
          description: Success message
        licenseKey:
          type: string
          description: The revoked license key
        revokedAt:
          type: string
          format: date-time
          description: Revocation timestamp

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Error type or category
        message:
          type: string
          description: Human-readable error message
      example:
        error: Internal server error
        message: An unexpected error occurred

    ValidationError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Error type
          example: Validation failed
        message:
          type: string
          description: Error message
        details:
          type: array
          description: Detailed validation errors
          items:
            type: object
            required:
              - field
              - message
            properties:
              field:
                type: string
                description: Field that failed validation
              message:
                type: string
                description: Validation error message
