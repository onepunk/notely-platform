# OpenResty/Nginx configuration for Notely Platform V3
# Using OpenResty for CrowdSec Lua bouncer support
user nobody;
worker_processes auto;
error_log /usr/local/openresty/nginx/logs/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /usr/local/openresty/nginx/conf/mime.types;
    default_type application/octet-stream;

    # =========================================================================
    # CrowdSec Bouncer Configuration
    # =========================================================================
    # Shared dictionary for caching CrowdSec ban decisions
    lua_shared_dict crowdsec_cache 10m;

    # Initialize Lua modules on startup
    init_by_lua_block {
        local crowdsec = require("crowdsec")
        crowdsec.init()

        local signed_downloads = require("signed_downloads")
        signed_downloads.init()
    }

    # Check requests against CrowdSec decisions
    # This runs for every request before processing
    access_by_lua_block {
        -- Block direct IP access: only allow Cloudflare and Docker internal traffic
        if ngx.var.is_cloudflare == "0" then
            return ngx.exit(444)
        end

        local crowdsec = require("crowdsec")
        crowdsec.check()
    }

    # =========================================================================
    # API Authorization Map Directives
    # =========================================================================
    # These maps determine which endpoints allow anonymous access and check
    # for credentials. Used by api.conf and other server blocks.

    # Endpoints that allow anonymous access (no credentials required)
    map $uri $api_allow_anonymous {
        default 0;
        ~^/api/status$ 1;
        ~^/api/auth/ 1;
        ~^/api/portal/auth/(login|register|refresh|validate|verify-email|resend-verification)$ 1;
        ~^/api/oauth/(authorize|token|interactions|microsoft/callback)$ 1;
        ~^/api/outlook/callback$ 1;
        ~^/api/license/validate$ 1;
        ~^/api/license/tiers(/.*)?$ 1;
        ~^/api/portal/releases/latest(/[^/]+)?$ 1;
        ~^/api/portal/releases/[^/]+/download$ 1;
        # Public config endpoints
        ~^/api/public/config/ 1;
        # Support beta endpoints (public for registration flow)
        ~^/api/support/beta/(signup|status|validate|verify-email|resend-verification)$ 1;
        ~^/api/support/contact$ 1;
        # License activation endpoints (authenticated via license key, not user JWT)
        ~^/api/license/(activate|deactivate|revalidate)$ 1;
        # Internal API endpoints - authenticated via X-Internal-Api-Key header by portal-bff
        ~^/api/internal/ 1;
    }

    # Check for Authorization header
    map $http_authorization $api_has_auth_header {
        default 0;
        "~.+" 1;
    }

    # Check for auth cookies
    map $http_cookie $api_has_auth_cookie {
        default 0;
        "~(access_token|refresh_token)=" 1;
    }

    # Check for API key header
    map $http_x_api_key $api_has_api_key {
        default 0;
        "~.+" 1;
    }

    # Combine credential checks
    map "$api_has_auth_header$api_has_auth_cookie$api_has_api_key" $api_has_credentials {
        default 0;
        "~1" 1;
    }

    # Final decision: deny if not anonymous and no credentials
    map "$api_allow_anonymous$api_has_credentials" $api_deny_request {
        default 1;
        "10" 0;
        "11" 0;
        "01" 0;
    }

    # =========================================================================
    # CORS Origin Whitelist
    # =========================================================================
    # Only allow specific origins for credentialed cross-origin requests.
    # Empty string = no CORS headers sent (browser blocks the request).
    # Security: Prevents CSRF attacks by only allowing known trusted origins.
    map $http_origin $cors_origin {
        default "";
        # Production domains (port 443 implicit) and dev (port 8443 explicit)
        ~^https://portal\.notely\.ai(:\d+)?$ $http_origin;
        ~^https://api\.notely\.ai(:\d+)?$ $http_origin;
        ~^https://notely\.ai(:\d+)?$ $http_origin;
        ~^https://get\.notely\.ai(:\d+)?$ $http_origin;
        ~^https://ws\.notely\.ai(:\d+)?$ $http_origin;
    }

    # Only send credentials header when origin is whitelisted
    map $cors_origin $cors_credentials {
        default "";
        ~.+ "true";
    }

    # Real IP configuration for Cloudflare
    # These directives extract the real client IP from X-Forwarded-For header
    # when requests come through Cloudflare's proxy network
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # =========================================================================
    # Cloudflare-Only Access Control
    # =========================================================================
    # Only allow traffic from Cloudflare edge servers and Docker internal network.
    # Uses $realip_remote_addr (the original connecting IP before real_ip rewriting)
    # so this checks who actually connected to us, not the end-user IP.
    geo $realip_remote_addr $is_cloudflare {
        default 0;
        # Cloudflare IPv4 ranges (must match set_real_ip_from above)
        173.245.48.0/20 1;
        103.21.244.0/22 1;
        103.22.200.0/22 1;
        103.31.4.0/22 1;
        141.101.64.0/18 1;
        108.162.192.0/18 1;
        190.93.240.0/20 1;
        188.114.96.0/20 1;
        197.234.240.0/22 1;
        198.41.128.0/17 1;
        162.158.0.0/15 1;
        104.16.0.0/13 1;
        104.24.0.0/14 1;
        172.64.0.0/13 1;
        131.0.72.0/22 1;
        # Cloudflare IPv6 ranges
        2400:cb00::/32 1;
        2606:4700::/32 1;
        2803:f800::/32 1;
        2405:b500::/32 1;
        2405:8100::/32 1;
        2a06:98c0::/29 1;
        2c0f:f248::/32 1;
        # Docker internal network (health checks, metrics, inter-service)
        172.16.0.0/12 1;
        127.0.0.1 1;
        ::1 1;
    }

    # IP Whitelist for Admin Access
    # The ip-whitelist.conf file is dynamically generated via Admin Settings → Security
    # Located in /etc/nginx/dynamic/ (bind-mounted directory for reliable sync)
    # - "default 1;" only → Allow all IPs
    # - "default 0;" with specific IPs → Only allow listed IPs
    # Uses $remote_addr which contains the real client IP after real_ip processing
    geo $admin_ip_allowed {
        include /etc/nginx/dynamic/ip-whitelist.conf;
    }

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /usr/local/openresty/nginx/logs/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 1G;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Security: Hide server version and upstream technology headers
    server_tokens off;                      # Hide nginx version (nginx/1.x.x -> nginx)
    proxy_hide_header X-Powered-By;         # Strip Express/Node.js header
    proxy_hide_header Server;               # Strip upstream Server header

    # DNS resolver for dynamic service discovery
    # Docker's internal DNS (127.0.0.11) resolves container hostnames
    # valid=10s: cache DNS results for 10 seconds, then re-resolve
    # ipv6=off: disable IPv6 resolution (not needed for Docker internal network)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Resolver timeout for DNS queries
    resolver_timeout 5s;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=downloads:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # WebSocket connection limiting
    # 10m = 10 megabytes of shared memory (~80,000 unique IPs)
    limit_conn_zone $binary_remote_addr zone=ws_conn:10m;

    # =========================================================================
    # Upstream Definitions (LEGACY - kept for reference)
    # =========================================================================
    # IMPORTANT: These upstream blocks are NO LONGER USED for proxying.
    #
    # We now use variable-based proxy_pass in server blocks, which forces nginx
    # to resolve DNS on each request using the resolver directive above.
    # This prevents stale IP issues when containers restart and get new IPs.
    #
    # Example in server blocks:
    #   set $upstream_portal portal:3204;
    #   proxy_pass http://$upstream_portal;
    #
    # These upstream blocks are kept for reference and could be used in the
    # future if nginx-plus features (dynamic resolution, health checks) are needed.
    # =========================================================================
    upstream gateway {
        server gateway:3200 max_fails=3 fail_timeout=30s;
        keepalive 32;
        keepalive_requests 100;
        keepalive_timeout 60s;
    }

    upstream auth {
        server auth:3201 max_fails=3 fail_timeout=30s;
        keepalive 32;
        keepalive_requests 100;
        keepalive_timeout 60s;
    }

    upstream portal {
        server portal:3204 max_fails=3 fail_timeout=30s;
        keepalive 32;
        keepalive_requests 100;
        keepalive_timeout 60s;
    }

    upstream ws_gateway {
        server ws-gateway:3217 max_fails=3 fail_timeout=30s;
        keepalive 32;
        keepalive_timeout 60s;
    }

    # =========================================================================
    # Internal Metrics Server (for Prometheus nginx-exporter)
    # =========================================================================
    # This server block handles internal metrics requests from the Docker network.
    # It's the default server for requests that don't match other server_name directives.
    server {
        listen 80 default_server;
        server_name _;

        # Nginx stub_status for prometheus nginx-exporter
        location /nginx_status {
            stub_status on;
            access_log off;
            # Only allow access from Docker internal network
            allow 172.16.0.0/12;
            allow 127.0.0.1;
            deny all;
        }

        # Default response for other requests to this server block
        location / {
            return 444;
        }
    }

    # Include additional configurations (OpenResty path)
    include /usr/local/openresty/nginx/conf/conf.d/*.conf;
}