<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}}</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background-color: #f5f5f5;
      color: #132E2D;
    }
    .wrapper {
      max-width: 600px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    .container {
      background-color: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }
    .header {
      background-color: #132E2D;
      padding: 32px 40px;
      text-align: center;
    }
    .logo {
      height: 40px;
      width: auto;
    }
    .logo-text {
      color: #B8F75D;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin: 0;
    }
    .content {
      padding: 40px;
    }
    .content h1 {
      color: #132E2D;
      font-size: 24px;
      font-weight: 600;
      margin: 0 0 20px 0;
    }
    .content p {
      color: #444444;
      font-size: 16px;
      line-height: 1.6;
      margin: 0 0 16px 0;
    }
    .highlight-box {
      background-color: #f8f9fa;
      border-left: 4px solid #B8F75D;
      padding: 16px 20px;
      margin: 24px 0;
      border-radius: 0 8px 8px 0;
    }
    .highlight-box p {
      margin: 0;
      color: #132E2D;
    }
    .button {
      display: inline-block;
      background-color: #132E2D;
      color: #ffffff !important;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 16px;
      margin: 16px 0;
    }
    .button:hover {
      background-color: #1a3d3c;
    }
    .footer {
      background-color: #f8f9fa;
      padding: 24px 40px;
      text-align: center;
      border-top: 1px solid #e9ecef;
    }
    .footer p {
      color: #6c757d;
      font-size: 13px;
      margin: 0 0 8px 0;
    }
    .footer a {
      color: #132E2D;
      text-decoration: none;
    }
    .social-links {
      margin-top: 16px;
    }
    .social-links a {
      display: inline-block;
      margin: 0 8px;
      color: #6c757d;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="container">
      <div class="header">
        <p class="logo-text">Notely</p>
      </div>
      <div class="content">
        {{content}}
      </div>
      <div class="footer">
        <p>{{footerText}}</p>
        <p><a href="https://yourdomain.com">yourdomain.com</a></p>
      </div>
    </div>
  </div>
</body>
</html>
